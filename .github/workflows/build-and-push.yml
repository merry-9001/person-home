name: Build and Push to Another Repo

on:
  push:
    branches:
      - main   # 改成你的源码仓库分支

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # 改成你的 Node 版本

      - name: Install dependencies
        run: npm ci   # 没有 package-lock.json 就改 npm install

      - name: Build project
        run: npm run build   # 改成你的实际构建命令

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/merry-9001/merry-9001.github.io.git target-repo

      - name: Replace target repo contents
        run: |
          find target-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r dist/* target-repo/

      - name: Commit and push
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Build from source-repo @ ${GITHUB_SHA}" 
          git push 