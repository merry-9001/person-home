name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    name: Read CI config
    runs-on: ubuntu-latest
    outputs:
      sonarcloud_enabled: ${{ steps.config.outputs.sonarcloud_enabled }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read SonarCloud switch
        id: config
        shell: bash
        run: |
          set -euo pipefail
          source .github/ci-config.env
          echo "sonarcloud_enabled=${SONARCLOUD_ENABLED:-true}" >> "$GITHUB_OUTPUT"

  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: config
    if: >
      needs.config.outputs.sonarcloud_enabled == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
